name: CI/CD Smart Blue-Green Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Execute Smart Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 35.208.11.45
          username: g2016348092
          key: ${{ secrets.SSH_KEY }}
          
          fingerprint: "SHA256:kLQPAj/8xxkctJmqmGIw4fXwAOy1havz1ROyzmZpTTA"
          script_stop: true
          script: |
            
            STATE_FILE="/home/g2016348092/current_deploy.env"
            TEMPLATE="/home/g2016348092/nginx.conf.template"

            
            if [ -f "$STATE_FILE" ]; then
                source "$STATE_FILE"
            else
                DEPLOY_COLOR=blue
            fi

            if [ "$DEPLOY_COLOR" == "blue" ]; then
                export TARGET_COLOR="green"
                export TARGET_PORT="8081"
            else
                export TARGET_COLOR="blue"
                export TARGET_PORT="8080"
            fi

            echo "Estado actual: $DEPLOY_COLOR. Cambiando a: $TARGET_COLOR en puerto $TARGET_PORT"

        
            export APP_TARGET_IP="127.0.0.1"
            export APP_TARGET_PORT="$TARGET_PORT"
            export DEPLOYMENT_COLOR="$TARGET_COLOR"

            
        
            sudo envsubst '$APP_TARGET_IP $APP_TARGET_PORT $DEPLOYMENT_COLOR' < "$TEMPLATE" > /tmp/default.conf
            sudo mv /tmp/default.conf /etc/nginx/conf.d/default.conf

           
            if sudo nginx -t; then
                sudo systemctl reload nginx
                
                echo "DEPLOY_COLOR=$TARGET_COLOR" > "$STATE_FILE"
                echo "¡EXITO! Ahora el servidor responde en color $TARGET_COLOR"
            else
                echo "ERROR: La configuración de Nginx falló."
                exit 1
            fi
